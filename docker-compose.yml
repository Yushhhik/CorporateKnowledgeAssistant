services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  qdrant:
    image: "qdrant/qdrant"
    ports:
      - "6333:6333"
      - "6334:6334"

  app:
    build: ./api_service
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - qdrant
    environment:
      - HF_HOME=/app/hf_cache
      - HF_ENDPOINT=https://hf-mirror.com
      - FASTEMBED_CACHE_PATH=/app/hf_cache
    volumes:
      - ./hf_cache:/app/hf_cache

  bot:
    build: ./bot_service
    depends_on:
      - app
    env_file:
      - .env
    environment:
      - PROXY_URL=socks5://host.docker.internal:10808
    extra_hosts:
      - "host.docker.internal:host-gateway"