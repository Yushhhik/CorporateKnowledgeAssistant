services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: "qdrant/qdrant"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: ./api_service
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - HF_HOME=/app/hf_cache
      - HF_ENDPOINT=https://hf-mirror.com
      - FASTEMBED_CACHE_PATH=/app/hf_cache
      - QDRANT_HOST=qdrant
    volumes:
      - ./hf_cache:/app/hf_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build: ./bot_service
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PROXY_URL=socks5://host.docker.internal:10808
    extra_hosts:
      - "host.docker.internal:host-gateway"